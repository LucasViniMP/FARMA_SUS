<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Criação de conta no portal FarmaSUS" />
    <title>Criar conta | FarmaSUS</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/cadastro.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="pagina-cadastro">
    <header class="cabecalho">
      <a class="marca" href="index.html" aria-label="FarmaSUS - página de login">
        <span class="cruz-marca" aria-hidden="true"></span>
        <span>FarmaSUS</span>
      </a>
    </header>

    <div class="pagina">
      <main class="conteudo-autenticacao">
        <section class="painel" aria-labelledby="titulo-pagina">
          <div class="introducao-formulario">
            <h1 id="titulo-pagina">Crie sua conta</h1>
            <p>Preencha seus dados para se cadastrar no FarmaSUS.</p>
          </div>

          <form id="formulario-cadastro" class="formulario grade-cadastro" data-tipo-formulario="cadastro" novalidate>
            <div class="campo largura-total">
              <label for="nome-completo">Nome completo</label>
              <input
                id="nome-completo"
                name="nomeCompleto"
                type="text"
                autocomplete="name"
                placeholder="Seu nome completo"
                aria-describedby="erro-nome-completo"
                required
              />
              <span class="erro-campo" id="erro-nome-completo" aria-live="polite"></span>
            </div>

            <div class="campo">
              <label for="cpf">CPF</label>
              <input
                id="cpf"
                name="cpf"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
                placeholder="000.000.000-00"
                aria-describedby="erro-cpf"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                required
              />
              <span class="erro-campo" id="erro-cpf" aria-live="polite"></span>
            </div>

            <div class="campo">
              <label for="data-nascimento">Data de nascimento</label>
              <input
                id="data-nascimento"
                name="dataNascimento"
                type="date"
                autocomplete="bday"
                aria-describedby="erro-data-nascimento"
                required
              />
              <span class="erro-campo" id="erro-data-nascimento" aria-live="polite"></span>
            </div>

            <div class="campo largura-total">
              <label for="email-cadastro">E-mail</label>
              <input
                id="email-cadastro"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="seuemail@exemplo.com"
                aria-describedby="erro-email-cadastro"
                required
              />
              <span class="erro-campo" id="erro-email-cadastro" aria-live="polite"></span>
            </div>

            <div class="campo">
              <label for="senha-cadastro">Senha</label>
              <div class="campo-senha">
                <input
                  id="senha-cadastro"
                  name="senha"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Crie uma senha"
                  aria-describedby="erro-senha-cadastro"
                  required
                />
                <button
                  class="alternar-senha"
                  type="button"
                  data-campo-senha="senha-cadastro"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                </button>
              </div>
              <span class="erro-campo" id="erro-senha-cadastro" aria-live="polite"></span>
            </div>

            <div class="campo">
              <label for="confirmar-senha">Confirmar senha</label>
              <div class="campo-senha">
                <input
                  id="confirmar-senha"
                  name="confirmarSenha"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Repita a senha"
                  aria-describedby="erro-confirmar-senha"
                  required
                />
                <button
                  class="alternar-senha"
                  type="button"
                  data-campo-senha="confirmar-senha"
                  aria-label="Mostrar confirmação de senha"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                </button>
              </div>
              <span class="erro-campo" id="erro-confirmar-senha" aria-live="polite"></span>
            </div>

            <button class="botao-principal largura-total" type="submit">Criar minha conta</button>

            <div class="mensagem-formulario largura-total" data-mensagem-formulario role="status" aria-live="polite"></div>
          </form>

          <p class="link-alternativo">
            Já tem uma conta? <a href="index.html">Entrar</a>
          </p>
        </section>
      </main>

      <footer class="rodape">FarmaSUS</footer>
    </div>
  </body>
</html>
