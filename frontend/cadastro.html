<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Criação de conta no portal FarmaSUS" />
    <title>Criar conta | FarmaSUS</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="register-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="FarmaSUS - página de login">
        <span class="brand-cross" aria-hidden="true"></span>
        <span>FarmaSUS</span>
      </a>
    </header>

    <div class="page-shell">
      <main class="auth-main auth-main--register">
        <section class="auth-panel auth-panel--register" aria-labelledby="page-title">
          <div class="panel-heading">
            <h1 id="page-title">Crie sua conta</h1>
            <p>Preencha seus dados para se cadastrar no FarmaSUS.</p>
          </div>

          <form id="register-form" class="auth-form register-grid" data-form-type="register" novalidate>
            <div class="form-field grid-full">
              <label for="full-name">Nome completo</label>
              <input
                id="full-name"
                name="fullName"
                type="text"
                autocomplete="name"
                placeholder="Seu nome completo"
                aria-describedby="full-name-error"
                required
              />
              <span class="field-error" id="full-name-error" aria-live="polite"></span>
            </div>

            <div class="form-field">
              <label for="cpf">CPF</label>
              <input
                id="cpf"
                name="cpf"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
                placeholder="000.000.000-00"
                aria-describedby="cpf-error"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                required
              />
              <span class="field-error" id="cpf-error" aria-live="polite"></span>
            </div>

            <div class="form-field">
              <label for="birth-date">Data de nascimento</label>
              <input
                id="birth-date"
                name="birthDate"
                type="date"
                autocomplete="bday"
                aria-describedby="birth-date-error"
                required
              />
              <span class="field-error" id="birth-date-error" aria-live="polite"></span>
            </div>

            <div class="form-field grid-full">
              <label for="register-email">E-mail</label>
              <input
                id="register-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="seuemail@exemplo.com"
                aria-describedby="register-email-error"
                required
              />
              <span class="field-error" id="register-email-error" aria-live="polite"></span>
            </div>

            <div class="form-field">
              <label for="register-password">Senha</label>
              <div class="password-control">
                <input
                  id="register-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Crie uma senha"
                  aria-describedby="register-password-error"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="register-password"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="register-password-error" aria-live="polite"></span>
            </div>

            <div class="form-field">
              <label for="confirm-password">Confirmar senha</label>
              <div class="password-control">
                <input
                  id="confirm-password"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Repita a senha"
                  aria-describedby="confirm-password-error"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="confirm-password"
                  aria-label="Mostrar confirmação de senha"
                  aria-pressed="false"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="confirm-password-error" aria-live="polite"></span>
            </div>

            <button class="primary-button grid-full" type="submit">Criar minha conta</button>

            <div class="form-message grid-full" data-form-message role="status" aria-live="polite"></div>
          </form>

          <p class="alternate-action">
            Já tem uma conta? <a href="index.html">Entrar</a>
          </p>
        </section>
      </main>

      <footer class="site-footer">FarmaSUS</footer>
    </div>
  </body>
</html>
